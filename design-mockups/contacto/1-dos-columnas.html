<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Contacto — Mockup 1: Dos columnas</title>
<link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(15.5% 0.01 165);
    --bg-2: oklch(19% 0.012 165);
    --ink: oklch(96% 0.005 165);
    --muted: oklch(76% 0.015 165);
    --accent: oklch(83% 0.21 152);
    --accent-ink: oklch(20% 0.045 155);
    --line-on-accent: oklch(20% 0.045 155 / 25%);
  }
  * { margin: 0; box-sizing: border-box; }
  body { background: var(--bg); font-family: Chivo, sans-serif; -webkit-font-smoothing: antialiased; }
  .mono { font-family: "JetBrains Mono", monospace; }
  .data-label { font-family: "JetBrains Mono", monospace; font-size: 0.6875rem;
    letter-spacing: 0.08em; text-transform: uppercase; }

  section { background: var(--accent); color: var(--accent-ink); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 80px 32px; }

  /* Dos columnas: pitch a la izquierda, formulario a la derecha */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 72px; align-items: start; }
  h2 { font-size: clamp(2.6rem, 5vw, 4.4rem); font-weight: 900; line-height: 0.98;
    letter-spacing: -0.02em; margin-top: 16px; }
  .sub { margin-top: 20px; font-size: 18px; line-height: 1.6; color: color-mix(in oklch, var(--accent-ink) 80%, transparent); max-width: 30ch; }
  .side-actions { margin-top: 36px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .btn-dark { display: inline-flex; align-items: center; gap: 8px; background: var(--accent-ink);
    color: var(--accent); font-weight: 700; font-size: 14px; padding: 14px 24px; border-radius: 6px;
    text-decoration: none; }
  .link-plain { display: inline-flex; align-items: center; gap: 8px; font-family: "JetBrains Mono", monospace;
    font-size: 14px; text-decoration: none; color: var(--accent-ink); }
  .link-plain:hover { text-decoration: underline; text-underline-offset: 4px; }

  /* Formulario: campos oscuros sobre el verde */
  form { display: flex; flex-direction: column; gap: 16px; }
  .field label { display: block; margin-bottom: 7px; }
  .field input, .field textarea {
    width: 100%; background: var(--bg); border: 1px solid transparent; border-radius: 6px;
    color: var(--ink); font-family: Chivo, sans-serif; font-size: 15px; padding: 13px 15px;
  }
  .field textarea { min-height: 130px; resize: vertical; line-height: 1.55; }
  .field input::placeholder, .field textarea::placeholder { color: var(--muted); }
  .submit { margin-top: 4px; background: var(--accent-ink); color: var(--accent); border: none;
    font-family: Chivo, sans-serif; font-weight: 700; font-size: 15px; padding: 15px 24px;
    border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; }
  .foot { margin-top: 56px; border-top: 1px solid var(--line-on-accent); padding-top: 24px;
    display: flex; justify-content: space-between; font-family: "JetBrains Mono", monospace; font-size: 14px; }
  .foot a { color: var(--accent-ink); text-decoration: none; }
  svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<section>
  <div class="wrap">
    <div class="grid">
      <!-- Columna izquierda: el pitch -->
      <div>
        <p class="data-label">¿Listo para empezar tu proyecto?</p>
        <h2>Hablemos</h2>
        <p class="sub">¿Tenés un proyecto en mente o necesitás servicio técnico? Escribime y lo charlamos.</p>
        <div class="side-actions">
          <a class="btn-dark" href="#">
            <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            Escribime por WhatsApp
          </a>
          <a class="link-plain" href="#">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Descargar CV (PDF)
          </a>
        </div>
      </div>

      <!-- Columna derecha: el formulario -->
      <form>
        <div class="field">
          <label class="data-label" for="n">Nombre</label>
          <input id="n" type="text" placeholder="Cómo te llamás" />
        </div>
        <div class="field">
          <label class="data-label" for="e">Email</label>
          <input id="e" type="email" placeholder="tu@email.com" />
        </div>
        <div class="field">
          <label class="data-label" for="m">Mensaje</label>
          <textarea id="m" placeholder="Contame qué necesitás resolver."></textarea>
        </div>
        <button class="submit" type="button">
          Enviar mensaje
          <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>
    </div>

    <div class="foot">
      <a href="#">WhatsApp · +54 299 673-1008</a>
      <a href="#">Email · brunoezequiel.merino@gmail.com</a>
    </div>
  </div>
</section>
</body>
</html>
